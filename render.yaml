services:
  - type: web
    name: ai-driver-booking-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: driver-booking-db
          property: connectionString

databases:
  - name: driver-booking-db
    databaseName: driver_booking
    user: driver_user
    plan: free
