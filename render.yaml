services:
  - type: web
    name: ai-driver-booking-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: driver-booking-db
          property: connectionString

databases:
  - name: driver-booking-db
    databaseName: driver_booking
    user: driver_user
    plan: free